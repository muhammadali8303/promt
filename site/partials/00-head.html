<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SUNFIZZ — Real Fruit Soda</title>
<meta name="description" content="SUNFIZZ sparkling fruit soda in glass bottles. Real fruit, light fizz, no sugar added." />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preload" as="image" href="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261120_070622_93733524-ae88-4030-bcf5-052bfac8f786.png&w=2048&q=90" crossorigin="anonymous" />
<style>
@font-face{font-family:"Barlow Condensed";src:url(https://fonts.gstatic.com/s/barlowcondensed/v13/HTxyL3I-JCGChYJ8VI-L6OO_au7B6xTrf3fmu4kG.woff2) format("woff2");font-weight:800;font-style:italic;font-display:block}
@font-face{font-family:"Barlow Condensed";src:url(https://fonts.gstatic.com/s/barlowcondensed/v13/HTxyL3I-JCGChYJ8VI-L6OO_au7B6xTrW3bmu4kG.woff2) format("woff2");font-weight:900;font-style:italic;font-display:block}
@font-face{font-family:"Manrope";src:url(https://fonts.gstatic.com/s/manrope/v23/xn7gYHE41ni1AdIRggexSg.woff2) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}

:root{
  --cocoa:#4A1E17;
  --coral:#E25B45;
  --cream:#FFF3EC;
  --peach:#FCD9C8;
  --peach2:#F5B39A;
  --ease:cubic-bezier(.22,1,.36,1);
  --disp:"Barlow Condensed",Impact,sans-serif;
  --body:"Manrope",system-ui,sans-serif;
  --sc:rgb(226,91,69);
  --sg:rgb(226,91,69);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F5B39A;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
html{scroll-behavior:auto}

canvas#gl{
  position:fixed;inset:0;width:100vw;height:100lvh;display:block;
  z-index:1;opacity:0;transition:opacity 1s var(--ease);
  touch-action:pan-y;cursor:grab;
}
body.ready canvas#gl{opacity:1}
body.dragging canvas#gl{cursor:grabbing}

header.nav{
  position:fixed;top:0;left:0;right:0;height:84px;z-index:5;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(-12px);
  transition:opacity .9s var(--ease),transform .9s var(--ease);
  pointer-events:none;
}
body.intro-ui header.nav{opacity:1;transform:none}

.logo{
  font-family:var(--disp);font-weight:900;font-style:italic;font-size:40px;line-height:1;
  letter-spacing:-.01em;color:var(--cream);text-shadow:0 1px 14px rgba(120,40,20,.18);
  position:relative;user-select:none;
}
.logo sup{
  font-family:var(--body);font-weight:600;font-size:9px;letter-spacing:.04em;
  vertical-align:super;margin-left:2px;opacity:.9;
}
.nav-right{
  position:absolute;right:48px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:34px;pointer-events:auto;
}
.menu-btn{
  display:flex;align-items:center;gap:8px;min-width:32px;min-height:32px;
  background:none;border:0;padding:0;cursor:pointer;color:var(--cream);
  font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.08em;
}
.dots{display:grid;grid-template-columns:repeat(2,4px);gap:3px}
.dots i{width:4px;height:4px;border-radius:1.5px;background:var(--cream);display:block}
.shop{
  font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:.08em;
  color:var(--cream);background:transparent;border:1.5px solid var(--cream);
  border-radius:999px;padding:9px 24px;cursor:pointer;
  transition:background .35s var(--ease),color .35s var(--ease);
}
.shop:hover{background:var(--cream);color:var(--cocoa)}

#hero{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:1}
h1.title{
  position:absolute;left:3.4vw;right:3.4vw;top:max(92px,11vh);margin:0;
  font-family:var(--disp);font-weight:900;font-style:italic;
  font-size:clamp(54px,7.4vw,112px);line-height:1;letter-spacing:-.015em;
  color:var(--cocoa);text-transform:uppercase;
  height:1em;overflow:hidden;
}
#hero h1.title,#hero .arrows{opacity:0;transition:opacity 1s var(--ease)}
body.intro-ui #hero h1.title,body.intro-ui #hero .arrows{opacity:1}
h1.title{transition:opacity 1s var(--ease)}
h1.title .tline{
  position:absolute;left:0;top:0;width:100%;white-space:nowrap;
  transform:translateY(0);opacity:1;
  transition:transform .62s var(--ease),opacity .62s var(--ease);
}
.arrows{
  position:absolute;right:3.2vw;bottom:max(40px,6vh);
  display:flex;gap:16px;pointer-events:auto;
}
.arrow{
  width:52px;height:52px;border-radius:50%;
  border:2px solid rgba(255,243,236,.95);
  background:rgba(255,243,236,.08);
  box-shadow:0 4px 18px rgba(150,60,30,.12);
  display:grid;place-items:center;cursor:pointer;padding:0;
  transition:background .3s var(--ease),transform .3s var(--ease);
  color:var(--cream);
}
.arrow:hover{background:rgba(255,243,236,.22);transform:scale(1.06)}
.arrow:active{transform:scale(.96)}
.arrow svg{width:18px;height:18px}
.strip{
  position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--sc) 18%,#fff 50%,var(--sc) 82%,transparent);
  box-shadow:0 0 22px 6px var(--sg),0 0 70px 18px var(--sg);
  opacity:.95;
}

#story{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;visibility:hidden}
#story .icons{
  position:absolute;left:4.4vw;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:22px;pointer-events:auto;
}
.icon{
  width:58px;height:58px;border-radius:50%;
  border:2px solid var(--cream);background:transparent;color:var(--cream);
  display:grid;place-items:center;cursor:pointer;padding:0;
  transition:background .45s var(--ease),color .45s var(--ease),transform .45s var(--ease);
}
.icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.active{background:var(--cream);color:var(--coral);transform:scale(1.08)}
.copy{
  position:absolute;left:51.5vw;top:50%;transform:translateY(-46%);
  width:min(36vw,520px);
}
.tag{display:flex;align-items:center;gap:10px}
.tagdot{width:22px;height:22px;border-radius:7px;background:var(--coral);flex:0 0 auto}
.tagtxt{
  font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--cocoa);
}
h2.stitle{
  position:relative;margin:18px 0 0;
  font-family:var(--disp);font-weight:900;font-style:italic;
  font-size:clamp(64px,7.6vw,118px);line-height:.9;letter-spacing:-.02em;
  color:var(--cocoa);min-height:1.8em;
}
h2.stitle .stitle-text{display:inline-block;transition:opacity .2s linear}
.bars{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;opacity:0;transition:opacity .18s linear}
.bars i{display:block;height:.16em;border-radius:.08em;background:rgba(74,30,23,.18);filter:blur(6px)}
.bars i:nth-child(1){width:80%}
.bars i:nth-child(2){width:56%}
.copy p{
  font-family:var(--body);font-weight:400;font-size:clamp(15px,1.25vw,19px);
  line-height:1.6;color:rgba(74,30,23,.86);margin:10px 0 0;
  transition:opacity .5s var(--ease),filter .5s var(--ease);
}
.fadeout{opacity:0;filter:blur(8px)}
.bars.show{opacity:1}

#track{position:relative;height:805vh;width:100%;z-index:0}

@media (max-width:820px), (orientation:portrait){
  header.nav{height:68px}
  .logo{font-size:30px}
  .menu-btn span{display:none}
  .nav-right{right:20px;gap:18px}
  h1.title{left:20px;right:20px;top:max(78px,10vh);font-size:clamp(46px,13vw,80px)}
  .arrows{right:20px;bottom:max(20px,4vh)}
  .arrow{width:48px;height:48px}
  #story .icons{left:auto;right:20px;top:auto;bottom:max(88px,12vh);transform:none;flex-direction:row;gap:12px}
  .icon{width:44px;height:44px}
  .icon svg{width:19px;height:19px}
  .copy{left:20px;right:20px;width:auto;top:max(86px,11vh);transform:none}
  h2.stitle{font-size:clamp(50px,13vw,84px)}
  .copy p{font-size:15px}
}
@media (max-width:360px){
  .logo{font-size:25px}
  .shop{padding:7px 11px}
}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  #story .icons{left:3vw;top:50%;right:auto;bottom:auto;transform:translateY(-50%);flex-direction:column;gap:14px}
  .icon{width:48px;height:48px}
  .copy{left:51.5vw;top:50%;transform:translateY(-46%);width:min(44vw,520px);right:auto}
  h2.stitle{font-size:clamp(40px,6vw,64px);min-height:1.7em}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001s !important}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<header class="nav">
  <div class="logo">SUNFIZZ<sup>™</sup></div>
  <div class="nav-right">
    <button class="menu-btn" type="button" aria-label="Menu">
      <span class="dots"><i></i><i></i><i></i><i></i></span><span>MENU</span>
    </button>
    <button class="shop" type="button" id="shopBtn">SHOP</button>
  </div>
</header>

<section id="hero">
  <h1 class="title" id="heroTitle"></h1>
  <div class="arrows">
    <button class="arrow" id="prevBtn" type="button" aria-label="Previous bottle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="arrow" id="nextBtn" type="button" aria-label="Next bottle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="strip" id="strip"></div>
</section>

<section id="story">
  <div class="icons">
    <button class="icon" data-i="0" type="button" aria-label="Fruit">
      <svg viewBox="0 0 24 24"><path d="M12 21c0-6 3-12 8-15 .8 5.6-2.3 12.6-8 15z"/><path d="M12 21c-4.4-.9-7.4-4-7.6-8.2 4.2.2 6.6 2.6 7.6 4.6"/></svg>
    </button>
    <button class="icon" data-i="1" type="button" aria-label="Bubbles">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="4"/><circle cx="17" cy="15" r="3"/><circle cx="7" cy="17" r="2"/></svg>
    </button>
    <button class="icon" data-i="2" type="button" aria-label="Sugar">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="6.4"/><path d="M12 7.6c-.6-2 .8-3.7 3.4-4-.2 2.4-1.3 3.6-3.4 4z"/><path d="M9.4 14.2c.6-1.4 2.4-1.6 3.4-.5"/></svg>
    </button>
    <button class="icon" data-i="3" type="button" aria-label="Sun">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
    </button>
  </div>
  <div class="copy">
    <div class="tag"><div class="tagdot"></div><div class="tagtxt" id="tagTxt">01 — Fruit</div></div>
    <h2 class="stitle" id="storyTitle">
      <span class="stitle-text" id="titleTxt"></span>
      <div class="bars" id="bars"><i></i><i></i></div>
    </h2>
    <p id="bodyTxt"></p>
  </div>
</section>

<div id="track"></div>
